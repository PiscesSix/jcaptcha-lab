name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Deps cho test (OCR level 9 + toán level 10)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python3 -m pip install --quiet numpy scipy pillow
      - name: Build
        run: ./build.sh
      - name: Start server (DEBUG=1)
        run: |
          DEBUG=1 CTF_TEST=1 RATE_LIMIT=5000 nohup java -Djava.awt.headless=true -cp out demo.Server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - name: API tests
        run: ./tests/api_test.sh http://localhost:8080
      - name: CTF tests (lời giải tự động)
        run: ./tests/ctf_test.sh http://localhost:8080
      - name: Sample images
        run: mkdir -p samples && cd samples && java -Djava.awt.headless=true -cp ../out demo.Samples 12
      - uses: actions/upload-artifact@v4
        with:
          name: captcha-samples
          path: samples/*.png
      - name: Server log
        if: always()
        run: cat server.log
